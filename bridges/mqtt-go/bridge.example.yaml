# Example config for the MQTT <-> mpubsub bridge.
#
# Each entry under bridges: is one-directional. To mirror a topic both ways,
# declare two entries (with different mqtt_topic/mpubsub_topic names to avoid
# accidental feedback loops via broker-echoed messages).

mqtt:
  broker: tcp://127.0.0.1:1883
  client_id: mpubsub-bridge
  # username: optional
  # password: optional
  qos: 0
  retain: false

mpubsub:
  port: 18512
  scope: link-local          # link-local | site-local | organization-local
  hops: 1
  retransmit_count: 1        # 1 = no retransmission; -1 = indefinite (requires retransmit_delay >= 1s)
  retransmit_delay: 100ms    # Go duration string; 0s supported for finite counts
  promote_qos: false         # raise effective retransmit_count based on incoming MQTT QoS
  # interface: eth0          # optional; defaults to the kernel-picked egress

  # Optional ChaCha20-Poly1305 (RFC 8439) payload encryption. Must match the
  # key set on the ESPHome device(s) via `mpubsub.encryption.key:` -- the
  # bridge SHA-256's this passphrase to the 32-byte AEAD key.
  # encryption:
  #   key: "any-length passphrase"
  #   replay_window: 30s       # drop packets older/newer than this; 0s (or omit) disables

bridges:
  # Take temperature published over MQTT and rebroadcast on multicast under
  # a renamed topic.
  - direction: mqtt_to_mpubsub
    mqtt_topic: "home/bridge/in/temp"
    mpubsub_topic: "home/livingroom/temp"

  # MQTT wildcard fan-out: omit mpubsub_topic to forward each matched MQTT
  # message under its own resolved topic. Here `home/bedroom/temp`,
  # `home/garage/temp`, etc. each end up on the matching mpubsub group --
  # subscribers can listen on the exact topic they care about.
  - direction: mqtt_to_mpubsub
    mqtt_topic: "home/+/temp"

  # Take a multicast message and republish it to MQTT.
  - direction: mpubsub_to_mqtt
    mpubsub_topic: "home/livingroom/temp"
    mqtt_topic: "home/bridge/out/temp"
    # require_encryption: true   # drop plaintext datagrams for this topic
                                 # (only valid on mpubsub_to_mqtt entries;
                                 #  requires mpubsub.encryption.key)
